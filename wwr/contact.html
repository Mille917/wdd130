<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Talk to you in this Contact us page for Rafting Plus.">
    <meta name="author" content="Raissa Bomboko Bofanga">
    <title>Contact us | Rafting Plus</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/z-raftingbw.png" alt="Rafting Plus Logo" class="logo">
        <nav aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-hero">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 999</p>
            <p>info@whitewater.com</p>
        </section>
        <section class="map-contact">
            <div class="map-section">
                <iframe title="Rafting Plus location map"
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31828.204865532898!2d15.301411349999999!3d-4.311840500000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2scd!4v1791649155106!5m2!1sen!2scd"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="contact-form" action="">
                <div class="contact-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="contact-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="contact-item3">
                    <label>Message Purpose</label>
                    <div class="radio-button">
                        <div>
                            <input type="radio" id="purpose" name="purpose" value="general">
                            <label for="purpose">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </div>
                <div class="contact-item2">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>
                <div>
                    <input type="checkbox" name="subscription" id="subscription">
                    <label for="subscription">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch! </button>
            </form>
        </section>
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img src="images/profil_picture_one.jpg" alt="Rafting Plus guide">
                    <figcaption>Responsible of communication</figcaption>
                </figure>
                <figure>
                    <img src="images/2profil_image.jpeg" alt="Rafting Plus team member">
                    <figcaption>Responsible of safety</figcaption>
                </figure>
                <figure>
                    <img src="images/3profile_images.jpeg"
                      alt="Rafting Plus customer service representative">
                    <figcaption>Responsible of finances</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>

        <p>&copy;

            <script>document.write(new Date().getFullYear()); </script> &#10020; Rafting Plus

            &#10020; Raïssa Bomboko Bofanga

        </p>

        <nav class="socialmedia" aria-label="Social media links">

            <a href="https://facebook.com" target="_blank">

                <img src="images/facebook.png" alt="Facebook Icon">

            </a>

            <a href="https://linkedin.com" target="_blank">

                <img src="images/linkedin.png" alt="LinkedIn Icon">

            </a>

            <a href="https://instagram.com" target="_blank">

                <img src="images/instagram.png" alt="Instagram Icon">

            </a>

        </nav>

    </footer>
</body>

</html>
